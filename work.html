<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>作品詳情 — Yun</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}

:root{
  --bg:#fbfaf8;
  --surface:#ffffff;
  --line:#e8e5e0;
  --ink:#1a1a18;
  --ink-2:#6e6a64;
  --ink-3:#a39e96;
  --shadow:0 1px 2px rgba(26,26,24,.04),0 8px 24px rgba(26,26,24,.06);
  --shadow-lg:0 2px 4px rgba(26,26,24,.05),0 18px 44px rgba(26,26,24,.11);
  --r:14px;
  --max:1080px;
  --sp-w:620px;        /* ← 銷售頁預覽框寬度 */
  --shrink:80%;        /* ← 縮小型圖片格（3D 產品素材）的寬度 */
  --veil:.62;          /* ← 詳細頁的覆蓋層比首頁再白一點，讓標題好讀 */
}

html{scroll-behavior:smooth}
body{
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans TC',sans-serif;
  background:var(--bg);color:var(--ink);
  line-height:1.7;-webkit-font-smoothing:antialiased;overflow-x:hidden;
}
a{text-decoration:none;color:inherit}
img{display:block;max-width:100%}
:focus-visible{outline:2px solid var(--ink);outline-offset:3px}

/* ── 固定背景層（作品主圖） ── */
.bg-img{position:fixed;inset:0;z-index:0;background-size:cover;background-position:center;background-color:#d8d4ce}
.bg-veil{position:fixed;inset:0;z-index:0;background:rgba(255,255,255,var(--veil))}

/* ── NAV ── */
.nav{position:fixed;top:1.25rem;left:0;right:0;z-index:200;display:flex;justify-content:center;padding:0 1rem}
.nav-inner{
  display:flex;align-items:center;gap:.35rem;
  background:rgba(255,255,255,.8);backdrop-filter:blur(16px) saturate(1.4);
  -webkit-backdrop-filter:blur(16px) saturate(1.4);
  border:1px solid rgba(232,229,224,.9);border-radius:999px;
  padding:.4rem .5rem;box-shadow:0 4px 20px rgba(26,26,24,.07);
}
.nav a.nav-link,.nav .lang-btn{
  padding:.42rem 1.05rem;border-radius:999px;font-size:.82rem;
  letter-spacing:.09em;text-transform:uppercase;font-weight:600;
  color:var(--ink-2);transition:.25s;background:none;border:none;cursor:pointer;
  font-family:inherit;white-space:nowrap;
}
.nav a.nav-link:hover,.nav .lang-btn:hover{color:var(--ink);background:var(--bg)}
.nav a.nav-link.back{display:inline-flex;align-items:center;gap:.5rem}
.nav a.nav-link.back i{font-style:normal;transition:transform .3s}
.nav a.nav-link.back:hover i{transform:translateX(-4px)}
.nav-div{width:1px;height:16px;background:var(--line);margin:0 .3rem}
.lang-btn{font-size:.72rem!important;padding:.42rem .6rem!important}
.lang-btn.active{color:var(--ink);text-decoration:underline;text-underline-offset:4px}

/* ── HERO ── */
.whero{
  position:relative;z-index:1;background:transparent;
  min-height:clamp(430px,62svh,640px);
  display:flex;align-items:flex-end;justify-content:center;padding:9rem 0 4rem;
}
.whero-in{position:relative;z-index:2;width:100%;max-width:var(--max);margin:0 auto;padding:0 2rem;text-align:center;animation:rise .6s cubic-bezier(.22,1,.36,1) both}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.whero h1{font-size:clamp(1.75rem,4.2vw,3rem);font-weight:800;letter-spacing:-.025em;line-height:1.2}
.whero p{margin:1.15rem auto 0;max-width:560px;font-size:clamp(.9rem,1.5vw,1.02rem);color:#3a3733;line-height:1.9}
.whero-meta{margin-top:1.5rem;font-size:.7rem;font-weight:600;letter-spacing:.24em;text-transform:uppercase;color:var(--ink-2)}
.hero-fade{position:absolute;left:0;right:0;bottom:0;height:200px;background:linear-gradient(transparent,var(--bg));z-index:1}
.tags{display:flex;gap:.4rem;justify-content:center;flex-wrap:wrap;margin-bottom:1.15rem}
.tag{font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2);background:rgba(255,255,255,.82);border:1px solid var(--line);border-radius:999px;padding:.24rem .75rem}
.tag.hi{background:var(--ink);border-color:var(--ink);color:#fff}

/* ── 內容層（蓋住固定背景） ── */
.content{position:relative;z-index:1;background:var(--bg)}
.wrap{max-width:var(--max);margin:0 auto;padding:0 2rem}

/* 數據 */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:1rem;padding:3rem 0 .5rem}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:1.2rem 1.35rem;box-shadow:var(--shadow)}
.stat-v{font-size:1.45rem;font-weight:800;letter-spacing:-.01em;line-height:1.1}
.stat-l{margin-top:.4rem;font-size:.75rem;color:var(--ink-3);letter-spacing:.03em}

/* 兩欄資訊列 */
.row{display:grid;grid-template-columns:130px 1fr;gap:2rem;padding:2.1rem 0;border-bottom:1px solid var(--line)}
.row:first-of-type{padding-top:3rem}
.row-lbl{font-size:.72rem;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-3);padding-top:.2rem}
.row-txt{font-size:.94rem;color:var(--ink-2);line-height:1.95;max-width:64ch}
.row-txt strong{color:var(--ink);font-weight:600}
.chips{display:flex;gap:.5rem;flex-wrap:wrap}
.whero .chips{justify-content:center;margin-top:1.45rem}
.chip{padding:.4rem 1rem;background:var(--surface);border:1px solid var(--line);border-radius:999px;font-size:.83rem;color:var(--ink-2);transition:.25s}
.chip:hover{border-color:var(--ink);color:var(--ink)}

/* 大段落標題（橫線） */
.psec{display:flex;align-items:center;gap:.9rem;padding:3.6rem 0 .6rem}
.psec-lbl{font-size:.74rem;font-weight:700;letter-spacing:.2em;text-transform:uppercase;white-space:nowrap}
.psec-line{flex:1;height:1px;background:var(--line)}
.psec-n{font-size:.7rem;letter-spacing:.1em;color:var(--ink-3);white-space:nowrap}

/* 小節標題（直條，與首頁一致） */
.sgroup{animation:fadeIn .45s ease both}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.sgroup-head{display:flex;align-items:center;gap:.7rem;margin:2.5rem 0 .3rem}
.psec+.sgroup .sgroup-head{margin-top:1.5rem}
.sgroup-bar{width:3px;height:1.05rem;border-radius:2px;background:var(--ink);flex-shrink:0}
.sgroup-head h3{font-size:1.06rem;font-weight:700;letter-spacing:.01em;line-height:1.4}
.sgroup-head .note{font-size:.68rem;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
.sgroup-desc{font-size:.88rem;color:var(--ink-2);line-height:1.8;margin:.2rem 0 1.15rem .95rem;max-width:62ch}

/* 圖片格 */
.grid{display:grid;gap:.9rem;margin-bottom:.5rem}
.grid+.grid{margin-top:1.8rem}
.grid.shrink{max-width:var(--shrink);margin-left:auto;margin-right:auto}
.grid.c1{grid-template-columns:1fr}
.grid.c2{grid-template-columns:repeat(2,1fr)}
.grid.c3{grid-template-columns:repeat(3,1fr)}
.grid.c4{grid-template-columns:repeat(4,1fr)}
.tile{
  position:relative;display:block;overflow:hidden;cursor:zoom-in;
  background:#e4e0da;border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);
  transition:transform .4s cubic-bezier(.22,1,.36,1),box-shadow .4s,border-color .4s;
}
.tile:hover{transform:translateY(-6px);box-shadow:var(--shadow-lg);border-color:#dcd8d1}
.tile img{width:100%;height:100%;object-fit:cover;transition:transform .7s cubic-bezier(.22,1,.36,1)}
.tile:hover img{transform:scale(1.05)}
.tile.sq{aspect-ratio:1/1}
.tile.wide{grid-column:1/-1}
.tile.auto img{height:auto}
/* 直式長圖：hover 自動上捲預覽 */
.tile.long{height:440px}
.tile.long img{height:auto;object-fit:fill;transition:transform 7s ease-in-out}
.tile.long:hover img{transform:translateY(calc(-100% + 440px))}
.tfade{position:absolute;left:0;right:0;bottom:0;height:110px;background:linear-gradient(transparent,rgba(255,255,255,.94));pointer-events:none}
.hint{
  position:absolute;top:.8rem;right:.8rem;font-size:.64rem;letter-spacing:.1em;text-transform:uppercase;
  background:rgba(255,255,255,.9);border:1px solid var(--line);border-radius:999px;
  padding:.2rem .6rem;color:var(--ink-3);transition:opacity .3s;
}
.tile.long:hover .hint{opacity:0}

/* 銷售頁瀏覽器框 */
.sp{max-width:var(--sp-w);margin:0 auto .5rem;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--surface);box-shadow:var(--shadow)}
.sp-bar{display:flex;align-items:center;gap:.42rem;padding:.6rem .9rem;background:var(--bg);border-bottom:1px solid var(--line)}
.sp-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.sp-url{flex:1;margin:0 .55rem;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:.2rem .8rem;font-size:.72rem;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sp-zoom{background:none;border:none;font-family:inherit;font-size:.68rem;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);cursor:pointer;padding:.2rem .4rem;border-radius:999px;transition:.25s}
.sp-zoom:hover{color:var(--ink);background:var(--surface)}
.sp-body{height:520px;overflow-y:auto;position:relative;scrollbar-width:thin;scrollbar-color:#d5d0c9 transparent}
.sp-body::-webkit-scrollbar{width:6px}
.sp-body::-webkit-scrollbar-thumb{background:#d5d0c9;border-radius:3px}
.sp-body img{width:100%}
.sp-hint{position:sticky;bottom:0;padding:.6rem;text-align:center;font-size:.7rem;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-3);background:linear-gradient(transparent,rgba(255,255,255,.95));pointer-events:none;transition:opacity .3s}

/* 文案卡 */
.copy{background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--ink);border-radius:0 var(--r) var(--r) 0;padding:1.05rem 1.3rem;margin-bottom:.7rem;box-shadow:var(--shadow)}
.copy-type{font-size:.68rem;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);margin-bottom:.45rem}
.copy-text{font-size:.92rem;color:var(--ink-2);line-height:1.9}
.copy-text em{font-style:normal;font-weight:600;color:var(--ink)}

/* 影片 */
.video{position:relative;aspect-ratio:16/9;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:#e4e0da;box-shadow:var(--shadow)}
.video iframe{position:absolute;inset:0;width:100%;height:100%;border:0}

/* 輪播 */
.car{position:relative;margin-bottom:.5rem}
.car-win{overflow:hidden;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);box-shadow:var(--shadow)}
.car-track{display:flex;transition:transform .45s cubic-bezier(.22,1,.36,1)}
.car-slide{min-width:100%}
.car-slide img{width:100%}
.car-nav{
  position:absolute;top:50%;transform:translateY(-50%);width:42px;height:42px;border-radius:50%;
  background:rgba(255,255,255,.92);border:1px solid var(--line);box-shadow:var(--shadow);
  color:var(--ink);font-size:1.15rem;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.25s;z-index:5;
}
.car-nav:hover:not(:disabled){background:#fff;box-shadow:var(--shadow-lg)}
.car-nav:disabled{opacity:.3;cursor:not-allowed}
.car-nav.prev{left:.85rem}
.car-nav.next{right:.85rem}
.car-foot{display:flex;align-items:center;justify-content:center;gap:.5rem;margin-top:.9rem}
.car-dot{width:7px;height:7px;padding:0;border:none;border-radius:50%;background:var(--line);cursor:pointer;transition:.25s}
.car-dot.active{background:var(--ink);transform:scale(1.3)}
.car-count{margin-left:.5rem;font-size:.74rem;letter-spacing:.08em;color:var(--ink-3)}

/* Lightbox */
.lb{position:fixed;inset:0;z-index:1000;display:none;align-items:center;justify-content:center;background:rgba(26,26,24,.86);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.lb.on{display:flex}
.lb img{max-width:min(92vw,1200px);max-height:88vh;object-fit:contain;border-radius:10px;background:#fff;box-shadow:0 24px 60px rgba(0,0,0,.42)}
.lb.tall{align-items:flex-start;overflow-y:auto;padding:4.5rem 0}
.lb.tall img{max-height:none;width:min(92vw,880px)}
.lb-btn{
  position:fixed;width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.92);
  border:1px solid rgba(255,255,255,.6);color:var(--ink);font-size:1.25rem;cursor:pointer;
  display:flex;align-items:center;justify-content:center;transition:.2s;z-index:2;
}
.lb-btn:hover{background:#fff;transform:scale(1.06)}
.lb-x{top:1.4rem;right:1.5rem}
.lb-prev{left:1.6rem;top:50%;margin-top:-22px}
.lb-next{right:1.6rem;top:50%;margin-top:-22px}
.lb-count{position:fixed;bottom:1.6rem;left:50%;transform:translateX(-50%);background:rgba(255,255,255,.92);border-radius:999px;padding:.32rem 1rem;font-size:.76rem;letter-spacing:.08em;color:var(--ink-2);z-index:2}

/* 頁尾導引 */
.wend{margin-top:4rem;padding:3.4rem 0 1rem;border-top:1px solid var(--line);text-align:center}
.wend p{color:var(--ink-3);font-size:.85rem;letter-spacing:.04em;margin-bottom:1.5rem}
.clink{display:inline-flex;align-items:center;gap:.7rem;padding:.95rem 2rem;background:var(--surface);border:1px solid var(--line);border-radius:999px;font-size:.93rem;transition:.3s;box-shadow:var(--shadow)}
.clink:hover{background:var(--ink);color:#fff;border-color:var(--ink);transform:translateY(-3px)}

/* WAVE + FOOTER */
.wave{display:block;width:100%;height:80px;margin-top:4rem}
.wave path{fill:none;stroke:var(--line);stroke-width:1.5}
footer{position:relative;z-index:1;background:var(--surface);border-top:1px solid var(--line);text-align:center;padding:2.4rem 1rem;color:var(--ink-3);font-size:.8rem;letter-spacing:.05em}

/* 狀態 */
.state{position:relative;z-index:1;min-height:70svh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:1rem;padding:9rem 1.5rem 4rem}
.state h2{font-size:1.6rem;font-weight:800}
.state p{color:var(--ink-2);font-size:.92rem}
.state .dot{width:7px;height:7px;border-radius:50%;background:var(--ink-3);animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.25;transform:scale(.8)}50%{opacity:1;transform:scale(1)}}

/* RESPONSIVE */
@media(max-width:900px){
  .grid.c4{grid-template-columns:repeat(3,1fr)}
}
@media(max-width:768px){
  .nav{top:.7rem}
  .nav-inner{padding:.3rem .35rem}
  .nav a.nav-link{padding:.38rem .75rem;font-size:.74rem}
  .wrap{padding:0 1.25rem}
  .whero{min-height:auto;padding:7.5rem 0 2.5rem}
  .stats{grid-template-columns:1fr;gap:.7rem;padding-top:2.4rem}
  .row{grid-template-columns:1fr;gap:.7rem;padding:1.7rem 0}
  .row:first-of-type{padding-top:2.4rem}
  .psec{padding-top:2.8rem}
  .grid{gap:.65rem}
  .grid.c4,.grid.c3{grid-template-columns:repeat(3,1fr)}
  .grid.shrink{max-width:100%}
  .sp-body{height:420px}
  .tile.long{height:360px}
  .tile.long:hover img{transform:translateY(calc(-100% + 360px))}
}
@media(max-width:560px){
  .grid{gap:.45rem}
  .grid.c2{grid-template-columns:1fr}
  .grid.c3,.grid.c4{grid-template-columns:repeat(2,1fr)}
  .tile{border-radius:10px}
  .lb-prev{left:.6rem}
  .lb-next{right:.6rem}
  .sgroup-desc{margin-left:.8rem;font-size:.82rem}
}
@media(prefers-reduced-motion:reduce){
  .whero-in,.sgroup{animation:none}
  .tile,.tile img,.car-track{transition:none}
  .tile:hover{transform:none}
  .tile:hover img,.tile.long:hover img{transform:none}
  .state .dot{animation:none}
}
</style>
</head>
<body>

<div class="bg-img" id="bgImg"></div>
<div class="bg-veil"></div>

<nav class="nav">
  <div class="nav-inner">
    <a href="index.html" class="nav-link back"><i>←</i><span data-zh="作品集" data-en="Work">作品集</span></a>
    <span class="nav-div"></span>
    <button class="lang-btn" data-lang="zh">中</button>
    <button class="lang-btn" data-lang="en">EN</button>
  </div>
</nav>

<div id="content">
  <div class="state"><span class="dot"></span><p data-zh="載入中" data-en="Loading">載入中</p></div>
</div>

<footer><p>&copy; 2024 Yunting-Wu. All rights reserved.</p></footer>

<script>
/* ══ i18n ══ */
let lang = localStorage.getItem('lang') ||
  ((navigator.language||'').toLowerCase().startsWith('zh') ? 'zh' : 'en');

const t = f => !f ? '' : (typeof f === 'string' ? f : (f[lang] || f.zh || f.en || ''));
const clean = s => (s||'').replace(/[\u2b95\u2192\u279c]\s*$/,'').trim();   // 去掉標題結尾的箭頭

const T = {
  zh:{
    notFound:'找不到這件作品', loadError:'作品資料載入失敗', noId:'網址沒有指定作品',
    oops:'糟糕', back:'回到作品集', scrollHint:'向下捲動看完整頁',
    year:'年份', tools:'使用工具', overview:'企劃說明', brief:'設計說明',
    visual:'視覺內容', video:'影片', gallery:'作品一覽',
    items:n=>`${n} 件`, clips:n=>`${n} 支`, hover:'HOVER 預覽', zoom:'放大', more:'看看其他作品'
  },
  en:{
    notFound:'That work isn\u2019t here', loadError:'Couldn\u2019t load the work data', noId:'No work specified in the URL',
    oops:'Oops', back:'Back to work', scrollHint:'Scroll to see the full page',
    year:'Year', tools:'Tools', overview:'Overview', brief:'Approach',
    visual:'Visual', video:'Video', gallery:'Gallery',
    items:n=>`${n} items`, clips:n=>`${n} videos`, hover:'HOVER', zoom:'Zoom', more:'Browse other work'
  }
};
const L = k => T[lang][k];

const CAT = {
  zh:{ video:'影片', '3d':'3D', graphic:'視覺設計' },
  en:{ video:'Video', '3d':'3D', graphic:'Visual Design' }
};
const catName = c => (CAT[lang] && CAT[lang][c]) || c || '';

function applyStaticLang(){
  document.querySelectorAll('[data-zh]').forEach(el=>{
    const v = el.dataset[lang];
    if(v !== undefined) el.innerHTML = v;
  });
  document.documentElement.lang = lang==='zh' ? 'zh-TW' : 'en';
  document.querySelectorAll('.lang-btn').forEach(b=>b.classList.toggle('active', b.dataset.lang===lang));
}
document.querySelectorAll('.lang-btn').forEach(b=>b.addEventListener('click',()=>{
  lang = b.dataset.lang;
  localStorage.setItem('lang', lang);
  applyStaticLang();
  if(currentWork) render(currentWork);
}));

/* ══ 載入 ══ */
const workId = new URLSearchParams(location.search).get('id');
let currentWork = null;

async function load(){
  if(!workId) return showState(L('oops'), L('noId'));
  try{
    const works = await (await fetch('works.json')).json();
    const work = works.find(w=>w.id === workId);
    if(!work) return showState(L('oops'), L('notFound'));
    currentWork = work;
    render(work);
  }catch(e){
    console.error('works.json 載入失敗', e);
    showState(L('oops'), L('loadError'));
  }
}

function showState(title, msg){
  document.getElementById('bgImg').style.backgroundImage = '';
  document.getElementById('content').innerHTML = `
    <div class="state">
      <h2>${title}</h2><p>${msg}</p>
      <a class="clink" href="index.html">${L('back')}</a>
    </div>`;
}

/* ══ 渲染 ══ */
function render(w){
  document.title = `${clean(t(w.title))} — Yun`;
  const heroImg = w.heroImage || w.thumbnail || '';
  document.getElementById('bgImg').style.backgroundImage = heroImg ? `url('${heroImg}')` : '';
  document.getElementById('content').innerHTML =
    hero(w) + `<div class="content"><div class="wrap">` +
    (w.type === 'project' ? projectBody(w) : skillBody(w)) +
    end() + `</div>` + wave() + `</div>`;
  wire();
}

function hero(w){
  let tags = [];
  if(w.tags) tags = Array.isArray(w.tags) ? w.tags : (w.tags[lang] || w.tags.zh || []);
  if(!tags.length) tags = [catName(w.category)].filter(Boolean);

  const meta = [w.year, catName(w.category)].filter(Boolean).join('　·　');

  /* project：hero 放長段說明；skill：hero 放短句，長段移到下方「設計說明」 */
  const isProject = w.type === 'project';
  const lead = isProject
    ? (t(w.detailedDescription) || t(w.description))
    : (t(w.description) || t(w.detailedDescription));

  /* skill 頁的使用工具改在 hero 呈現 */
  const chips = (!isProject && (w.technologies||[]).length)
    ? `<div class="chips">${w.technologies.map(x=>`<span class="chip">${x}</span>`).join('')}</div>`
    : '';

  return `
    <header class="whero">
      <div class="whero-in">
        <div class="tags">${tags.map((g,i)=>`<span class="tag${i===0?' hi':''}">${g}</span>`).join('')}</div>
        <h1>${clean(t(w.title))}</h1>
        <p>${lead}</p>
        ${chips}
        ${meta ? `<div class="whero-meta">${meta}</div>` : ''}
      </div>
      <div class="hero-fade"></div>
    </header>`;
}

const row = (lbl, html) => `<div class="row"><div class="row-lbl">${lbl}</div><div class="row-txt">${html}</div></div>`;
const psec = (lbl, note) => `<div class="psec"><span class="psec-lbl">${lbl}</span><div class="psec-line"></div>${note?`<span class="psec-n">${note}</span>`:''}</div>`;
const sgroup = (title, note, desc) => `
  <div class="sgroup">
    <div class="sgroup-head"><span class="sgroup-bar"></span><h3>${title}</h3>${note?`<span class="note">${note}</span>`:''}</div>
    ${desc?`<p class="sgroup-desc">${desc}</p>`:''}
  </div>`;
const tile = (src, alt, cls='sq') => `<a class="tile ${cls}" data-src="${src}"><img src="${src}" alt="${alt}" loading="lazy"></a>`;
const grid = (imgs, cols, alt, extra='') => `<div class="grid c${cols}${extra?' '+extra:''}" data-lb>${imgs.map((s,i)=>tile(s, `${alt} ${i+1}`)).join('')}</div>`;
const wave = () => `
  <svg class="wave" viewBox="0 0 1440 80" preserveAspectRatio="none">
    <path d="M0,46 C240,4 380,74 720,44 C1060,14 1220,72 1440,34"/>
    <path d="M0,58 C240,16 380,86 720,56 C1060,26 1220,84 1440,46" opacity=".5"/>
  </svg>`;
const end = () => `
  <div class="wend">
    <p>${L('more')}</p>
    <a class="clink" href="index.html">${L('back')}<span>→</span></a>
  </div>`;

/* ══ PROJECT ══ */
function projectBody(w){
  const stats = (w.stats||[]).map(s=>
    `<div class="stat"><div class="stat-v">${t(s.value)}</div><div class="stat-l">${t(s.label)}</div></div>`).join('');
  const tools = (w.technologies||[]).map(x=>`<span class="chip">${x}</span>`).join('');

  return (w.stats && w.stats.length ? `<div class="stats">${stats}</div>` : '')
    + (w.overview ? row(L('overview'), t(w.overview)) : '')
    + (tools ? row(L('tools'), `<div class="chips">${tools}</div>`) : '')
    + psec(L('visual'))
    + (w.projectSections||[]).map(section).join('');
}

function section(sec){
  const label = t(sec.label);
  const head = sgroup(label, t(sec.note), t(sec.description));

  switch(sec.type){
    case 'scrollPreview':{
      const file = sec.image ? sec.image.split('/').pop() : '';
      return head + `
        <div class="sp">
          <div class="sp-bar">
            <span class="sp-dot" style="background:#e0a49d"></span>
            <span class="sp-dot" style="background:#e6c78d"></span>
            <span class="sp-dot" style="background:#a9c8a4"></span>
            <span class="sp-url">${file}</span>
            <button class="sp-zoom" data-src="${sec.image||''}">${L('zoom')}</button>
          </div>
          <div class="sp-body">
            ${sec.image ? `<img src="${sec.image}" alt="${label}">` : `<div style="height:420px;background:var(--bg)"></div>`}
            <div class="sp-hint">${L('scrollHint')}</div>
          </div>
        </div>`;
    }
    case 'grid2':      return head + grid(sec.images||[], 2, label, 'shrink');
    case 'grid3':      return head + grid(sec.images||[], 3, label);
    case 'gridSquare': return head + grid(sec.images||[], 3, label);
    case 'copy':
      return head + (sec.items||[]).map(it=>`
        <div class="copy">
          <div class="copy-type">${t(it.type)}</div>
          <div class="copy-text">${it.headline?`<em>${t(it.headline)}</em><br>`:''}${t(it.body)}</div>
        </div>`).join('');
    default: return '';
  }
}

/* ══ SKILL ══ */
function countImages(w){
  let n = 0;
  if(w.gridGallery && w.gridGallery.images) n += w.gridGallery.images.length;
  (w.additionalGalleries||[]).forEach(g=> n += (g.images||[]).length);
  if(w.carouselImages) n += w.carouselImages.length;
  (w.additionalCarousels||[]).forEach(c=> n += (c.images||[]).length);
  if(w.images) n += w.images.length;
  return n;
}

function skillBody(w){
  let out = '';

  /* 設計說明：標籤可用 briefLabel 逐頁覆寫（例：插畫頁 → 關於創作） */
  if(w.detailedDescription)
    out += row(t(w.briefLabel) || L('brief'), t(w.detailedDescription));

  /* 影片 */
  const videos = (w.videos && w.videos.length) ? w.videos : (w.video ? [{url:w.video}] : []);
  if(videos.length){
    out += psec(L('video'), L('clips')(videos.length));
    videos.forEach(v=>{
      const id = videoId(v.url);
      if(!id) return;
      if(v.title || v.description) out += sgroup(t(v.title) || L('video'), '', t(v.description));
      out += `<div class="video"><iframe src="https://www.youtube.com/embed/${id}" title="${t(v.title)||'video'}" allowfullscreen loading="lazy"></iframe></div>`;
    });
  }

  /* 圖片 */
  const total = countImages(w);
  if(total){
    out += psec(L('gallery'), L('items')(total));
    let carN = 0;

    if(w.carouselImages && w.carouselImages.length)
      out += carousel(w.carouselImages, ++carN);

    if(w.gridGallery && w.gridGallery.images && w.gridGallery.images.length)
      out += grid(w.gridGallery.images, w.gridGallery.columns || 3, t(w.title));

    (w.additionalGalleries||[]).forEach(g=>{
      if(g.title || g.description) out += sgroup(t(g.title) || L('gallery'), '', t(g.description));
      out += grid(g.images||[], g.columns || 3, t(g.title) || t(w.title));
    });

    if(w.images && w.images.length)
      out += `<div class="grid c1" data-lb>${w.images.map((s,i)=>tile(s, `${t(w.title)} ${i+1}`, 'auto')).join('')}</div>`;

    (w.additionalCarousels||[]).forEach(c=>{
      if(c.title) out += sgroup(t(c.title), '', t(c.description));
      out += carousel(c.images||[], ++carN);
    });
  }
  return out;
}

function carousel(imgs, n){
  return `
    <div class="car" data-car="${n}">
      <div class="car-win"><div class="car-track">
        ${imgs.map((s,i)=>`<div class="car-slide"><img src="${s}" alt="Slide ${i+1}" ${i?'loading="lazy"':''}></div>`).join('')}
      </div></div>
      <button class="car-nav prev" aria-label="Previous">‹</button>
      <button class="car-nav next" aria-label="Next">›</button>
      <div class="car-foot">
        ${imgs.map((_,i)=>`<button class="car-dot${i?'':' active'}" data-i="${i}" aria-label="${i+1}"></button>`).join('')}
        <span class="car-count"><b class="cur">1</b> / ${imgs.length}</span>
      </div>
    </div>`;
}

function videoId(url){
  if(!url) return null;
  const m = url.match(/(?:youtube\.com\/(?:watch\?v=|embed\/)|youtu\.be\/)([^&?\s]+)/);
  return m ? m[1] : null;
}

/* ══ 互動 ══ */
function wire(){
  fitTiles();
  document.querySelectorAll('.car').forEach(initCarousel);
  document.querySelectorAll('.sp-body').forEach(sp=>{
    const hint = sp.querySelector('.sp-hint');
    sp.addEventListener('scroll', ()=>{ if(hint) hint.style.opacity = sp.scrollTop > 40 ? '0' : '1'; });
  });
}

/* 依圖片實際比例分流：超寬 → 整排寬幅；直式長圖 → hover 上捲 */
function fitTiles(){
  document.querySelectorAll('.tile img').forEach(img=>{
    const go = ()=>{
      const tileEl = img.closest('.tile');
      if(!tileEl || !img.naturalWidth || !tileEl.classList.contains('sq')) return;
      const r = img.naturalWidth / img.naturalHeight;
      if(r >= 1.9){
        tileEl.classList.replace('sq','wide');
        tileEl.style.aspectRatio = `${img.naturalWidth}/${img.naturalHeight}`;
      }else if(r <= .5){
        tileEl.classList.replace('sq','long');
        tileEl.insertAdjacentHTML('beforeend', `<span class="tfade"></span><span class="hint">${L('hover')}</span>`);
      }
    };
    img.complete ? go() : img.addEventListener('load', go, {once:true});
  });
}

function initCarousel(car){
  const track = car.querySelector('.car-track');
  const slides = [...track.children];
  const prev = car.querySelector('.prev'), next = car.querySelector('.next');
  const dots = [...car.querySelectorAll('.car-dot')];
  const cur = car.querySelector('.cur');
  let i = 0;

  const update = ()=>{
    track.style.transform = `translateX(-${i*100}%)`;
    dots.forEach((d,n)=>d.classList.toggle('active', n===i));
    cur.textContent = i+1;
    prev.disabled = i===0;
    next.disabled = i===slides.length-1;
  };
  next.onclick = ()=>{ if(i < slides.length-1){ i++; update(); } };
  prev.onclick = ()=>{ if(i > 0){ i--; update(); } };
  dots.forEach((d,n)=> d.onclick = ()=>{ i = n; update(); });

  let x0 = 0;
  track.addEventListener('touchstart', e=>{ x0 = e.changedTouches[0].screenX; }, {passive:true});
  track.addEventListener('touchend', e=>{
    const dx = e.changedTouches[0].screenX - x0;
    if(dx < -50 && i < slides.length-1) i++;
    else if(dx > 50 && i > 0) i--;
    else return;
    update();
  });
  update();
}

/* ══ Lightbox（全站共用一組） ══ */
const lb = document.createElement('div');
lb.className = 'lb';
lb.innerHTML = `
  <button class="lb-btn lb-x" aria-label="Close">×</button>
  <button class="lb-btn lb-prev" aria-label="Previous">‹</button>
  <button class="lb-btn lb-next" aria-label="Next">›</button>
  <img src="" alt="">
  <div class="lb-count"><b class="lb-cur">1</b> / <span class="lb-all">1</span></div>`;
document.body.appendChild(lb);

const lbImg  = lb.querySelector('img');
const lbCur  = lb.querySelector('.lb-cur');
const lbAll  = lb.querySelector('.lb-all');
const lbPrev = lb.querySelector('.lb-prev');
const lbNext = lb.querySelector('.lb-next');
const lbCount= lb.querySelector('.lb-count');
let list = [], idx = 0;

function openLB(srcs, i){
  list = srcs; idx = i;
  show();
  lb.classList.add('on');
  document.body.style.overflow = 'hidden';
}
function closeLB(){
  lb.classList.remove('on','tall');
  document.body.style.overflow = '';
}
function show(){
  lbImg.src = list[idx];
  lbImg.onload = ()=> lb.classList.toggle('tall', lbImg.naturalHeight / lbImg.naturalWidth > 1.6);
  lbCur.textContent = idx+1;
  lbAll.textContent = list.length;
  const solo = list.length < 2;
  lbPrev.style.display = (solo || idx===0) ? 'none' : 'flex';
  lbNext.style.display = (solo || idx===list.length-1) ? 'none' : 'flex';
  lbCount.style.display = solo ? 'none' : 'block';
  lb.scrollTop = 0;
}

document.addEventListener('click', e=>{
  const zoom = e.target.closest('.sp-zoom');
  if(zoom && zoom.dataset.src) return openLB([zoom.dataset.src], 0);

  const el = e.target.closest('.tile');
  if(!el || !el.dataset.src) return;
  const group = el.closest('[data-lb]');
  const items = group ? [...group.querySelectorAll('.tile')] : [el];
  openLB(items.map(x=>x.dataset.src), items.indexOf(el));
});

lb.addEventListener('click', e=>{ if(e.target === lb) closeLB(); });
lb.querySelector('.lb-x').addEventListener('click', closeLB);
lbPrev.addEventListener('click', ()=>{ if(idx > 0){ idx--; show(); } });
lbNext.addEventListener('click', ()=>{ if(idx < list.length-1){ idx++; show(); } });
document.addEventListener('keydown', e=>{
  if(!lb.classList.contains('on')) return;
  if(e.key === 'Escape') closeLB();
  if(e.key === 'ArrowLeft' && idx > 0){ idx--; show(); }
  if(e.key === 'ArrowRight' && idx < list.length-1){ idx++; show(); }
});

applyStaticLang();
load();
</script>
